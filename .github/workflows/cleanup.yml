name: Cleanup Old Workflow Runs

on:
  push:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs (keep latest 10)
        env:
          TOKEN: ${{ secrets.ACTIONS_CLEANUP_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Get all workflow run IDs sorted newest → oldest
          RUNS=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100" \
            | jq '.workflow_runs[].id')

          RUN_ARRAY=($RUNS)

          COUNT=0
          for RUN_ID in "${RUN_ARRAY[@]}"; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -le 10 ]; then
              echo "Keeping run $RUN_ID"
            else
              echo "Deleting run $RUN_ID"
              curl -s -X DELETE -H "Authorization: token $TOKEN" \
                "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID"
            fi
          done
