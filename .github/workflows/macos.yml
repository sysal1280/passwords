name: macOS Qt Build

on:
  push:
    tags:
      - "v*"  # Trigger on version tags like v1.0, v2.1, etc.
    branches:
      - "**"  # Trigger on any branch push (you can adjust this to only certain branches if needed)
  pull_request:  # You can remove this if you don't want to trigger on PRs

jobs:
  build:
    runs-on: macos-latest  # Use macOS for the build

    steps:
      # Checkout the code
      - name: Checkout source
        uses: actions/checkout@v3

      # Install Qt
      - name: Install Qt
        run: brew install qt

      # Configure CMake to find the Qt framework
      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      # Build the project with CMake
      - name: Build
        run: cmake --build build --config Release || cmake --build build

      # Bundle the Qt frameworks into the .app (macdeployqt step)
      - name: Bundle Qt frameworks into .app
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory"
            exit 1
          fi
          QT_BIN=$(brew --prefix qt)/bin/macdeployqt
          echo "Using macdeployqt at: $QT_BIN"
          "$QT_BIN" "$APP_PATH" -verbose=2

      # Upload the .app bundle as an artifact
      - name: Upload .app bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: macos-app  # Name of the artifact
          path: build/password.app/  # Path to the .app bundle to upload
          if-no-files-found: error  # Fail if no files are found

      # Download the artifact for release
      - name: Download built app for release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: macos-app  # Name of the artifact to download
          path: release-files  # Path where the artifact will be downloaded

      # Debug: show EXACT extracted structure
      - name: Debug - List files in release directory
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Listing release-files:"
          find release-files -maxdepth 6 -print  # List files to ensure the .app is in place

      # Publish the release
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/macOS-app/password.app/**  # Correct path to .app bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Ensure token is passed with the correct permissions

