name: macOS Qt Build

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        run: brew install qt

      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      - name: Build
        run: cmake --build build --config Release || cmake --build build

      - name: Bundle Qt frameworks into .app
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory"
            exit 1
          fi
          QT_BIN=$(brew --prefix qt)/bin/macdeployqt
          echo "Using macdeployqt at: $QT_BIN"
          "$QT_BIN" "$APP_PATH" -verbose=2

      # Upload the .app bundle as a FLAT artifact
      - name: Upload .app bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/password.app/
          if-no-files-found: error

      # Download the artifact for release
      - name: Download built app for release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release-files

      # Debug: show EXACT extracted structure
      - name: Debug - List files in release directory
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Listing release-files:"
          find release-files -maxdepth 6 -print

      # Publish the release
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/password.app/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

