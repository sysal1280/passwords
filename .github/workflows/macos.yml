name: macOS Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        run: brew install qt

      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle Qt frameworks into .app
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          /usr/local/opt/qt/bin/macdeployqt "$APP_PATH" -verbose=2

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: build/*.app

