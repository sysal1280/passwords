name: macOS Qt Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Create Python venv + install aqtinstall
        shell: bash
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt 6.6 with Charts
        shell: bash
        run: |
          source venv/bin/activate
          aqt install-qt mac desktop 6.6.0 clang_64 \
            --outputdir "$HOME/Qt" \
            --modules qtcharts

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.6.0/macos" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release || cmake --build build

      - name: Locate .app bundle
        id: find_app
        shell: bash
        run: |
          APP=$(find build -maxdepth 3 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app found"
            exit 1
          fi
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "Found app: $APP"

      - name: Prepare bundle directories
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/PlugIns"

      - name: Copy Qt frameworks (manual bundling)
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -R "$QT/lib/Qt"*.framework "$APP/Contents/Frameworks/" || true
          cp -L "$QT/lib/libQt6"*.dylib "$APP/Contents/Frameworks/" || true

      - name: Copy Qt plugins (manual bundling)
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -R "$QT/plugins/"* "$APP/Contents/PlugIns/" || true

      - name: Copy ICU libraries
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -L "$QT/lib/libicu"*.dylib "$APP/Contents/Frameworks/" || true

      - name: Fix loader paths with install_name_tool
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          EXE_NAME=$(defaults read "$APP/Contents/Info" CFBundleExecutable)
          EXE="$APP/Contents/MacOS/$EXE_NAME"

          echo "Fixing loader paths for: $EXE"

          install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE"

          for FW in "$APP/Contents/Frameworks/"*.framework; do
            NAME=$(basename "$FW" .framework)
            install_name_tool -id "@rpath/$NAME.framework/$NAME" "$FW/$NAME"
          done

          for DY in "$APP/Contents/Frameworks/"*.dylib; do
            install_name_tool -id "@rpath/$(basename "$DY")" "$DY"
          done

      - name: Verify bundle
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          echo "Frameworks:"
          ls -lh "$APP/Contents/Frameworks"
          echo "Plugins:"
          ls -lh "$APP/Contents/PlugIns"

          EXE_NAME=$(defaults read "$APP/Contents/Info" CFBundleExecutable)
          EXE="$APP/Contents/MacOS/$EXE_NAME"

          echo "Linked libraries:"
          otool -L "$EXE"

      - name: Create DMG
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app }}"
          DMG="password-macos.dmg"
          mkdir dmg
          cp -R "$APP" dmg/
          hdiutil create "$DMG" -volname "password" -srcfolder dmg -ov -format UDZO
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-passwords-bundle
          path: ${{ env.DMG }}
          if-no-files-found: error

