name: macOS Qt Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        run: brew install qt

      # Extract version from CMakeLists.txt
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -Eo 'project\(password VERSION [0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Extract git commit hash + dirty flag
      - name: Extract git commit hash
        id: git
        run: |
          HASH=$(git rev-parse --short HEAD)
          DIRTY=""
          if ! git diff --quiet --ignore-submodules HEAD; then
            DIRTY="-dirty"
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "dirty=$DIRTY" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      - name: Build
        run: cmake --build build --config Release || cmake --build build

      - name: Bundle Qt frameworks into .app
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory"
            exit 1
          fi
          QT_BIN=$(brew --prefix qt)/bin/macdeployqt
          echo "Using macdeployqt at: $QT_BIN"
          "$QT_BIN" "$APP_PATH" -verbose=2

      # Create DMG
      - name: Create DMG
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          DMG_NAME="password-macos-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}.dmg"
          mkdir dmg
          cp -R "$APP_PATH" dmg/
          hdiutil create "$DMG_NAME" -volname "password" -srcfolder dmg -ov -format UDZO
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}
          if-no-files-found: error

