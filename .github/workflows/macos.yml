name: macOS Qt Build

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        run: brew install qt

      - name: Configure CMake
        run: cmake -B build -DCMAKE_PREFIX_PATH=$(brew --prefix qt)

      - name: Build
        run: cmake --build build --config Release || cmake --build build

      - name: Bundle Qt frameworks into .app
        run: |
          APP_PATH=$(find build -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build directory"
            exit 1
          fi

          QT_BIN=$(brew --prefix qt)/bin/macdeployqt
          echo "Using macdeployqt at: $QT_BIN"

          "$QT_BIN" "$APP_PATH" -verbose=2

      - name: Upload .app bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: build/*.app
          
      - name: Debug — list build directory
        run: |
          echo "Listing build directory:"
          find build -maxdepth 4 -print

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*.app
            build/*/*.app
            build/*/*/*.app




