name: macOS Qt Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Create Python venv + install aqtinstall
        shell: bash
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt 6.6 with Charts
        shell: bash
        run: |
          source venv/bin/activate
          aqt install-qt mac desktop 6.6.0 clang_64 \
            --outputdir "$HOME/Qt" \
            --modules qtcharts

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.6.0/macos" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release || cmake --build build

      - name: Debug build tree
        shell: bash
        run: |
          echo "Contents of build/ (maxdepth 4):"
          find build -maxdepth 4 -print

      - name: Locate .app bundle
        id: find_app
        shell: bash
        run: |
          APP_PATH=$(find build -maxdepth 5 -name "*.app" | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under build/"
            find build -maxdepth 5 -type d -print
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP_PATH"

      - name: Ensure Info.plist exists inside bundle
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          INFO_PLIST="$APP/Contents/Info.plist"

          if [ -f "$INFO_PLIST" ]; then
            echo "Info.plist already present in bundle: $INFO_PLIST"
          else
            echo "Info.plist missing in bundle. Trying to copy from .qt/info_plist"
            # Look for generated Info.plist under build/.qt/info_plist/*
            SRC_INFO=$(find build/.qt/info_plist -maxdepth 2 -name Info.plist | head -n 1 || true)
            if [ -z "$SRC_INFO" ]; then
              echo "ERROR: Could not find Info.plist under build/.qt/info_plist"
              find build/.qt -maxdepth 5 -print || true
              exit 1
            fi
            echo "Copying Info.plist from $SRC_INFO to $INFO_PLIST"
            mkdir -p "$APP/Contents"
            cp "$SRC_INFO" "$INFO_PLIST"
          fi

      - name: Prepare bundle directories
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          mkdir -p "$APP/Contents/Frameworks"
          mkdir -p "$APP/Contents/PlugIns"

      - name: Copy Qt frameworks
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -R "$QT/lib/Qt"*.framework "$APP/Contents/Frameworks/" || true
          cp -L "$QT/lib/libQt6"*.dylib "$APP/Contents/Frameworks/" || true

      - name: Copy Qt plugins
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -R "$QT/plugins/"* "$APP/Contents/PlugIns/" || true

      - name: Copy ICU libraries
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          QT="$HOME/Qt/6.6.0/macos"

          cp -L "$QT/lib/libicu"*.dylib "$APP/Contents/Frameworks/" || true

      - name: Fix loader paths
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"

          # We know the target is called 'password', so the executable should be:
          EXE="$APP/Contents/MacOS/password"

          if [ ! -f "$EXE" ]; then
            echo "ERROR: Expected executable not found at $EXE"
            echo "Bundle contents:"
            find "$APP" -maxdepth 5 -print
            exit 1
          fi

          echo "Fixing loader paths for: $EXE"

          # Ensure the app can find frameworks in Contents/Frameworks
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$EXE"

          # Fix IDs for frameworks
          for FW in "$APP/Contents/Frameworks/"*.framework; do
            [ -e "$FW" ] || continue
            NAME=$(basename "$FW" .framework)
            if [ -f "$FW/$NAME" ]; then
              install_name_tool -id "@rpath/$NAME.framework/$NAME" "$FW/$NAME"
            fi
          done

          # Fix IDs for plain dylibs
          for DY in "$APP/Contents/Frameworks/"*.dylib; do
            [ -e "$DY" ] || continue
            install_name_tool -id "@rpath/$(basename "$DY")" "$DY"
          done

      - name: Verify bundle
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          echo "Frameworks:"
          ls -lh "$APP/Contents/Frameworks" || true
          echo "PlugIns:"
          ls -lh "$APP/Contents/PlugIns" || true

          EXE="$APP/Contents/MacOS/password"
          if [ -f "$EXE" ]; then
            echo "Linked libraries for $EXE:"
            otool -L "$EXE" || true
          else
            echo "Executable not found at $EXE"
          fi

      - name: Create DMG
        shell: bash
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          DMG="password-macos.dmg"
          mkdir dmg
          cp -R "$APP" dmg/
          hdiutil create "$DMG" -volname "password" -srcfolder dmg -ov -format UDZO
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-passwords-bundle
          path: ${{ env.DMG }}
          if-no-files-found: error

