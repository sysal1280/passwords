name: Windows Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts

      # Extract version from CMakeLists.txt
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -Eo 'project\(password VERSION [0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Extract git commit hash + dirty flag
      - name: Extract git commit hash
        id: git
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          DIRTY=""
          if ! git diff --quiet --ignore-submodules HEAD; then
            DIRTY="-dirty"
          fi
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "dirty=$DIRTY" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        run: cmake --build build --config Release

      # Deploy Qt DLLs using windeployqt6
      - name: Deploy Qt (windeployqt6)
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%PATH%
          mkdir app
          copy build\Release\password.exe app\
          windeployqt6 --release app\password.exe

      # Download GPG4Win
      - name: Download GPG4Win
        run: |
          mkdir deps
          curl -L -o deps\gpg4win-4.4.1.exe https://files.gpg4win.org/gpg4win-4.4.1.exe

      # Install Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup --no-progress
        
      - name: Generate Inno Setup script
        shell: powershell
        run: |
          @"
#define MyAppName "Passwords"
#define MyAppVersion GetEnv("APP_VERSION")
#define MyAppPublisher "Adam Lanzafame"
#define MyAppURL "https://github.com/sysal1280/passwords.git"
#define MyAppExeName "password.exe"

[Setup]
AppId={{0FD632D1-DA16-45DA-BBBE-F8778FD03E21}
AppName={#MyAppName}
AppVersion={#MyAppVersion}
AppPublisher={#MyAppPublisher}
AppPublisherURL={#MyAppURL}
AppSupportURL={#MyAppURL}
AppUpdatesURL={#MyAppURL}
DefaultDirName={autopf}\{#MyAppName}
UninstallDisplayIcon={app}\{#MyAppExeName}
ArchitecturesAllowed=x64compatible
ArchitecturesInstallIn64BitMode=x64compatible
DisableProgramGroupPage=yes
PrivilegesRequiredOverridesAllowed=dialog
OutputBaseFilename=Passwords-x86_64-{#MyAppVersion}
SolidCompression=yes
WizardStyle=modern dynamic

[Languages]
Name: "english"; MessagesFile: "compiler:Default.isl"

[Tasks]
Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

[Files]
Source: "{#SourcePath}\deps\gpg4win-4.4.1.exe"; DestDir: "{tmp}"; Flags: ignoreversion
Source: "{#SourcePath}\app\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

[Icons]
Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

[Run]
Filename: "{app}\{#MyAppExeName}"; Flags: nowait postinstall skipifsilent
Filename: "{tmp}\gpg4win-4.4.1.exe"; Parameters: "/S"; Flags: waituntilterminated
Filename: "{cmd}"; Parameters: "/C start https://sysal1280.github.io/passwords/"; Flags: postinstall runhidden
"@ | Out-File -Encoding UTF8 installer.iss


      # Build installer
      - name: Build installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # Upload installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Passwords-Installer-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}
          path: Output\Passwords-x86_64-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}.exe
          if-no-files-found: error

