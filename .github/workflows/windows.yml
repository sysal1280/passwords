name: Windows Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtcharts

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -Eo 'project\(password VERSION [0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract git commit hash
        id: git
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          DIRTY=""
          if ! git diff --quiet --ignore-submodules HEAD; then
            DIRTY="-dirty"
          fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "dirty=$DIRTY" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt (windeployqt6)
        shell: cmd
        run: |
          set PATH=%Qt6_DIR%\bin;%PATH%
          mkdir app
          copy build\Release\password.exe app\
          "%Qt6_DIR%\bin\windeployqt6.exe" --release app\password.exe

      - name: Download GPG4Win
        shell: bash
        run: |
          mkdir -p deps
          curl -L -o deps/gpg4win-4.4.1.exe "https://files.gpg4win.org/gpg4win-4.4.1.exe"

      - name: Download VC Redist
        shell: bash
        run: |
          mkdir -p deps
          curl -L -o deps/vc_redist.x64.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Generate Inno Setup script
        shell: bash
        run: |
          : > installer.iss
          echo '#define MyAppName "Passwords"' >> installer.iss
          echo '#define MyAppVersion GetEnv("APP_VERSION")' >> installer.iss
          echo '#define MyAppPublisher "Adam Lanzafame"' >> installer.iss
          echo '#define MyAppURL "https://github.com/sysal1280/passwords.git"' >> installer.iss
          echo '#define MyAppExeName "password.exe"' >> installer.iss
          echo >> installer.iss
          echo '[Setup]' >> installer.iss
          echo 'AppId={{0FD632D1-DA16-45DA-BBBE-F8778FD03E21}' >> installer.iss
          echo 'AppName={#MyAppName}' >> installer.iss
          echo 'AppVersion={#MyAppVersion}' >> installer.iss
          echo 'AppPublisher={#MyAppPublisher}' >> installer.iss
          echo 'AppPublisherURL={#MyAppURL}' >> installer.iss
          echo 'AppSupportURL={#MyAppURL}' >> installer.iss
          echo 'AppUpdatesURL={#MyAppURL}' >> installer.iss
          echo 'DefaultDirName={autopf}\{#MyAppName}' >> installer.iss
          echo 'UninstallDisplayIcon={app}\{#MyAppExeName}' >> installer.iss
          echo 'ArchitecturesAllowed=x64compatible' >> installer.iss
          echo 'ArchitecturesInstallIn64BitMode=x64compatible' >> installer.iss
          echo 'DisableProgramGroupPage=yes' >> installer.iss
          echo 'PrivilegesRequiredOverridesAllowed=dialog' >> installer.iss
          echo 'OutputBaseFilename=Passwords-x86_64-{#MyAppVersion}' >> installer.iss
          echo 'SolidCompression=yes' >> installer.iss
          echo 'WizardStyle=modern dynamic' >> installer.iss
          echo >> installer.iss
          echo '[Languages]' >> installer.iss
          echo 'Name: "english"; MessagesFile: "compiler:Default.isl"' >> installer.iss
          echo >> installer.iss
          echo '[Tasks]' >> installer.iss
          echo 'Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked' >> installer.iss
          echo >> installer.iss
          echo '[Files]' >> installer.iss
          echo 'Source: "{#SourcePath}\deps\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: ignoreversion' >> installer.iss
          echo 'Source: "{#SourcePath}\deps\gpg4win-4.4.1.exe"; DestDir: "{tmp}"; Flags: ignoreversion' >> installer.iss
          echo 'Source: "{#SourcePath}\app\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs' >> installer.iss
          echo >> installer.iss
          echo '[Icons]' >> installer.iss
          echo 'Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"' >> installer.iss
          echo 'Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon' >> installer.iss
          echo >> installer.iss
          echo '[Run]' >> installer.iss
          echo 'Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; Flags: waituntilterminated' >> installer.iss
          echo 'Filename: "{tmp}\gpg4win-4.4.1.exe"; Parameters: "/S"; Flags: waituntilterminated' >> installer.iss
          echo 'Filename: "{app}\password.exe"; Flags: nowait postinstall skipifsilent' >> installer.iss

      - name: Build installer
        shell: cmd
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Passwords-Installer-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}
          path: Output\Passwords-x86_64-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}.exe
          if-no-files-found: error

