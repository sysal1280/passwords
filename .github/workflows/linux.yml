name: Linux Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release
