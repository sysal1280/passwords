name: Linux Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install Qt and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-base-plugins \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-charts-dev \
            qt6-opengl-dev \
            patchelf

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact directory
        run: |
          mkdir -p passwords/lib
          mkdir -p passwords/plugins

      - name: Patch executable RPATH
        run: |
          patchelf --set-rpath '$ORIGIN/lib' build/password

      - name: Copy Qt plugins
        run: |
          QT_PLUGIN_DIR=$(qtpaths6 --plugin-dir)

          for plugin in \
            generic \
            iconengines \
            imageformats \
            platforminputcontexts \
            platforms \
            platformthemes \
            sqldrivers \
            tls \
            wayland-decoration-client \
            wayland-graphics-integration-client \
            wayland-shell-integration \
            xcbglintegrations
          do
            if [ -d "$QT_PLUGIN_DIR/$plugin" ]; then
              cp -r "$QT_PLUGIN_DIR/$plugin" passwords/plugins/
            else
              echo "Plugin directory not found: $plugin"
            fi
          done

      - name: Debug Qt libs
        run: |
          echo "Listing Qt6 libs:"
          ls -l /usr/lib/x86_64-linux-gnu/libQt6*

      - name: Copy Qt libraries
        run: |
          mkdir -p passwords/lib
          cp /usr/lib/x86_64-linux-gnu/libQt6*.so* passwords/lib/

      - name: Copy built executable
        run: |
          cp build/password passwords/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-passwords-bundle
          path: passwords

