      - name: Bundle Qt + fix RPATH
        shell: bash
        run: |
          mkdir -p bundle/lib
          mkdir -p bundle/plugins

          # Copy executable
          cp build/password bundle/

          QT_LIB_DIR=/usr/lib/x86_64-linux-gnu
          QT_PLUGIN_DIR=/usr/lib/x86_64-linux-gnu/qt6/plugins

          # Copy ALL Qt libs
          cp $QT_LIB_DIR/* bundle/lib/

          # Copy ALL plugins first
          cp -r $QT_PLUGIN_DIR/* bundle/plugins/

          # Now prune plugins according to your documentation
          cd bundle/plugins

          find . -maxdepth 1 -type d ! -name '.' \
            ! -name 'generic' \
            ! -name 'iconengines' \
            ! -name 'imageformats' \
            ! -name 'platforminputcontexts' \
            ! -name 'platforms' \
            ! -name 'platformthemes' \
            ! -name 'sqldrivers' \
            ! -name 'tls' \
            ! -name 'wayland-decoration-client' \
            ! -name 'wayland-graphics-integration-client' \
            ! -name 'wayland-shell-integration' \
            ! -name 'xcbglintegrations' \
            -exec rm -rf {} +

          cd ../../

          # Fix RPATH
          patchelf --set-rpath '$ORIGIN/lib' bundle/password

          chmod +x bundle/password

          OUTDIR="password-linux-${{ steps.version.outputs.version }}-${{ steps.git.outputs.hash }}${{ steps.git.outputs.dirty }}"
          mv bundle "$OUTDIR"
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"

