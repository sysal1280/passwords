name: Linux Qt Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            patchelf \
            python3-pip

      - name: Install OpenGL development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglx-dev \
            libopengl-dev

      - name: Install aqtinstall
        run: |
          python3 -m pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt 6.6 with Charts
        run: |
          aqt install-qt linux desktop 6.6.0 gcc_64 --outputdir $HOME/Qt
          aqt install-module linux desktop 6.6.0 gcc_64 qtcharts --outputdir $HOME/Qt

      - name: Add Qt to PATH
        run: |
          echo "$HOME/Qt/6.6.0/gcc_64/bin" >> $GITHUB_PATH

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_PREFIX_PATH=$HOME/Qt/6.6.0/gcc_64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Prepare artifact directory
        run: |
          mkdir -p passwords/lib
          mkdir -p passwords/plugins

      - name: Patch executable RPATH
        run: |
          patchelf --set-rpath '$ORIGIN/lib' build/password

      - name: Copy Qt libraries
        run: |
          QT_LIB_DIR=$HOME/Qt/6.6.0/gcc_64/lib
          cp -L "$QT_LIB_DIR"/libQt6*.so* passwords/lib/

      - name: Copy Qt plugins
        run: |
          QT_PLUGIN_DIR=$HOME/Qt/6.6.0/gcc_64/plugins
          cp -r "$QT_PLUGIN_DIR"/* passwords/plugins/

      - name: Copy built executable
        run: |
          cp build/password passwords/

      - name: Debug bundled Qt libs
        run: |
          echo "Bundled Qt6 libs:"
          ls -lh passwords/lib/libQt6*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-passwords-bundle
          path: passwords

